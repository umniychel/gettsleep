<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GettSleep PMS — Вход</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e8eaf0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-wrap { width: 380px; }
.login-logo { text-align: center; margin-bottom: 32px; }
.login-logo h1 { font-size: 32px; font-weight: 800; color: #4f6ef7; }
.login-logo p { color: #8b90a8; font-size: 14px; margin-top: 4px; }
.login-card { background: #1a1d27; border: 1px solid #2e3350; border-radius: 14px; padding: 32px; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 13px; color: #8b90a8; margin-bottom: 6px; }
input { background: #22263a; border: 1px solid #2e3350; border-radius: 8px; padding: 11px 14px; color: #e8eaf0; font-size: 14px; width: 100%; outline: none; transition: border-color .15s; }
input:focus { border-color: #4f6ef7; }
.btn { display: block; width: 100%; padding: 12px; background: #4f6ef7; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background .15s; }
.btn:hover { background: #3d5ce8; }
.error { color: #e74c3c; font-size: 13px; margin-bottom: 12px; background: rgba(231,76,60,.1); border: 1px solid rgba(231,76,60,.2); padding: 10px 14px; border-radius: 8px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <h1>GettSleep</h1>
    <p>Property Management System</p>
  </div>
  <div class="login-card">
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
        <div class="error">Неверный логин или пароль.</div>
      {% endif %}
      <div class="form-group">
        <label for="id_username">Логин</label>
        <input type="text" name="username" id="id_username" autofocus required>
      </div>
      <div class="form-group">
        <label for="id_password">Пароль</label>
        <input type="password" name="password" id="id_password" required>
      </div>
      <button type="submit" class="btn">Войти</button>
    </form>
  </div>
</div>
</body>
</html>
