{% extends "guest/base_public.html" %}
{% block title %}Регистрация — GettSleep{% endblock %}

{% block content %}
<div class="container" style="max-width:520px;padding-top:48px;padding-bottom:48px">
  <div style="text-align:center;margin-bottom:32px">
    <h1 style="font-size:28px;font-weight:700;margin-bottom:8px">Создать аккаунт</h1>
    <p style="color:var(--text2)">Зарегистрируйтесь для онлайн-бронирования</p>
  </div>

  <div class="card">
    <form method="post">
      {% csrf_token %}
      <div class="form-row">
        <div class="form-group">
          <label>Фамилия *</label>
          <input type="text" name="last_name" value="{{ form_data.last_name|default:'' }}" required>
        </div>
        <div class="form-group">
          <label>Имя *</label>
          <input type="text" name="first_name" value="{{ form_data.first_name|default:'' }}" required>
        </div>
      </div>
      <div class="form-group">
        <label>Логин *</label>
        <input type="text" name="username" value="{{ form_data.username|default:'' }}" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" value="{{ form_data.email|default:'' }}" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Пароль * (мин. 8 символов)</label>
          <input type="password" name="password1" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>Повторите пароль *</label>
          <input type="password" name="password2" required autocomplete="new-password">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Телефон</label>
          <input type="text" name="phone" value="{{ form_data.phone|default:'' }}" placeholder="+7 999 000 00 00">
        </div>
        <div class="form-group">
          <label>Гражданство</label>
          <input type="text" name="nationality" value="{{ form_data.nationality|default:'Россия' }}">
        </div>
      </div>
      <div class="form-group">
        <label>Номер документа (паспорт)</label>
        <input type="text" name="passport_number" value="{{ form_data.passport_number|default:'' }}" placeholder="Серия и номер паспорта">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px">Зарегистрироваться</button>
    </form>
  </div>

  <p style="text-align:center;margin-top:20px;color:var(--text2);font-size:14px">
    Уже есть аккаунт? <a href="/guest/login/" style="color:var(--accent)">Войти</a>
  </p>
</div>
{% endblock %}
