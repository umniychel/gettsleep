{% extends "guest/base_public.html" %}
{% block title %}Вход — GettSleep{% endblock %}

{% block content %}
<div class="container" style="max-width:420px;padding-top:60px;padding-bottom:60px">
  <div style="text-align:center;margin-bottom:32px">
    <h1 style="font-size:28px;font-weight:700;margin-bottom:8px">Вход в аккаунт</h1>
    <p style="color:var(--text2)">Войдите чтобы управлять бронированиями</p>
  </div>

  <div class="card">
    <form method="post">
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      {% csrf_token %}
      <div class="form-group">
        <label>Логин</label>
        <input type="text" name="username" autofocus required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px">Войти</button>
    </form>
  </div>

  <p style="text-align:center;margin-top:20px;color:var(--text2);font-size:14px">
    Нет аккаунта? <a href="/guest/register/" style="color:var(--accent)">Зарегистрироваться</a>
  </p>
  <p style="text-align:center;margin-top:10px;color:var(--text2);font-size:13px">
    Сотрудник хостела? <a href="/staff/login/" style="color:var(--text2)">Вход для персонала</a>
  </p>
</div>
{% endblock %}
