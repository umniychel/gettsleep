{% extends "guest/base_public.html" %}
{% block title %}Редактировать профиль — GettSleep{% endblock %}

{% block content %}
<div class="container" style="max-width:520px;padding-top:40px;padding-bottom:60px">
  <div style="margin-bottom:28px">
    <a href="/guest/cabinet/" style="color:var(--text2);text-decoration:none;font-size:14px">← Назад в кабинет</a>
    <h1 style="font-size:26px;font-weight:700;margin-top:10px">Редактировать профиль</h1>
  </div>

  <div class="card">
    <form method="post">
      {% csrf_token %}
      <div class="form-row">
        <div class="form-group">
          <label>Фамилия</label>
          <input type="text" name="last_name" value="{{ user.last_name }}">
        </div>
        <div class="form-group">
          <label>Имя</label>
          <input type="text" name="first_name" value="{{ user.first_name }}">
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ user.email }}">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Телефон</label>
          <input type="text" name="phone" value="{{ profile.phone }}">
        </div>
        <div class="form-group">
          <label>Гражданство</label>
          <input type="text" name="nationality" value="{{ profile.nationality }}">
        </div>
      </div>
      <div class="form-group">
        <label>Номер документа (паспорт)</label>
        <input type="text" name="passport_number" value="{{ profile.passport_number }}">
      </div>
      <div style="display:flex;gap:12px;margin-top:8px">
        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
        <a href="/guest/cabinet/" class="btn btn-secondary">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
